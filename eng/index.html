<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英语二 · 单词记忆</title>
<style>
:root{--bg:#EDEDED;--paper:#F7F7F7;--ink:#111;--ink2:#555;--ink3:#8A8A8A;
 --sky1:#1D3FD6;--mag:#D23BD6;--lime:#7CF54A;--yel:#F3E94C;--teal:#19C6B8;--blue:#2C52E0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "PingFang SC","Noto Sans SC",-apple-system,sans-serif;min-height:100vh;position:relative}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.ser{font-family:"Didot","Bodoni 72","Playfair Display","Songti SC",serif;font-weight:400;letter-spacing:.5px}
.ser i{font-style:italic}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:30px 44px 80px}
.sky{position:absolute;top:0;left:0;right:0;height:320px;background:linear-gradient(180deg,#2C52E0 0%,#6F9BF5 45%,#BFD5FF 78%,rgba(237,237,237,0) 100%);z-index:0}
.cloud{position:absolute;z-index:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0,#fff 35%,rgba(255,255,255,0) 72%);filter:blur(2px)}
/* hero */
.hero{position:relative;min-height:230px;display:flex;justify-content:space-between;align-items:flex-start}
.eyebrow{font-size:13px;letter-spacing:5px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.eyebrow span{letter-spacing:1px;color:rgba(255,255,255,.8)}
.date{font-size:112px;line-height:1.02;letter-spacing:-3px;margin:2px 0 6px;background:linear-gradient(180deg,#fff 0%,#F2F5FF 40%,#9FB3EC 50%,#fff 58%,#DCE5FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.meta{font-size:21px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.meta b{font-weight:400;font-size:30px;color:var(--yel);text-shadow:0 1px 0 #111}
.meta b.cd{font-size:72px;line-height:1;margin:0 6px;vertical-align:-10px}
.ring{text-align:right;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);padding-top:10px}
.ring .pct{font-size:104px;line-height:1}
.ring .pct.full{color:var(--lime);text-shadow:0 2px 0 #111}
.ring .cap{font-size:15px;letter-spacing:1.5px;margin-top:4px}
.bar{margin:14px 0 6px;height:14px;border:1.5px solid var(--ink);background:#fff;position:relative}
.bar i{display:block;height:100%;background:var(--yel);border-right:1.5px solid var(--ink);transition:width .4s}
.bar.full i{background:var(--lime)}
.barrow{display:flex;justify-content:space-between;font-size:15px;color:var(--ink2);margin-bottom:22px}
/* crumbs */
.crumbs{display:flex;gap:10px;align-items:center;margin:4px 0 22px;font-size:15px;color:var(--ink2);min-height:28px}
.crumbs button{border:1.5px solid var(--ink);background:#fff;padding:3px 12px;box-shadow:2px 2px 0 var(--ink)}
.crumbs button:active{transform:translate(2px,2px);box-shadow:none}
/* panels & stickers */
.panel{background:var(--paper);border:1.5px solid var(--ink);border-radius:18px;padding:22px 26px;position:relative;box-shadow:5px 5px 0 var(--ink);margin-bottom:22px}
.panel.soft{box-shadow:none;border-color:#C7C7C7;background:#F3F3F3}
h2{font-size:30px;margin:0 0 4px}
h2 .n{font-size:14px;color:var(--ink2);margin-left:12px;font-family:"PingFang SC"}
.hint{color:var(--ink2);font-size:15px;margin:0 0 16px}
.stk{display:inline-block;font-size:13px;letter-spacing:1px;background:#fff;border:1.5px solid var(--ink);padding:3px 11px;box-shadow:2px 2px 0 var(--ink);font-family:"PingFang SC"}
.stk.y{background:var(--yel)}.stk.l{background:var(--lime)}.stk.m{background:var(--mag);color:#fff}.stk.t{background:var(--teal)}.stk.b{background:var(--blue);color:#fff}
/* home grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tile{background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:20px 22px 18px;box-shadow:5px 5px 0 var(--ink);text-align:left;position:relative;min-height:150px;display:flex;flex-direction:column;transition:transform .08s}
.tile:hover{transform:translate(-1px,-1px)}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.tile.done{background:#F0FBE8}
.tile .no{font-size:13px;color:var(--ink2);letter-spacing:2px;padding-right:34px}
.tile .nm{font-size:26px;margin:6px 0 2px;line-height:1.15}
.tile .big{font-size:58px;line-height:1;margin:8px 0 2px}
.tile .sub{font-size:14.5px;color:var(--ink2);margin-top:auto;line-height:1.5}
.tile .chk{position:absolute;right:16px;top:14px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:#fff}
.tile.done .chk{background:radial-gradient(circle at 35% 30%,#D8FFC2,#7CF54A 55%,#38A814)}
.tile.done .chk::after{content:"";position:absolute;left:9px;top:5px;width:6px;height:11px;border:solid #111;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tile.wide{grid-column:span 2}
/* batches dots */
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.dots i{width:18px;height:18px;border:1.5px solid var(--ink);background:#fff;display:block}
.dots i.ok{background:var(--lime)}.dots i.cur{background:var(--yel)}
/* study card */
.study{max-width:760px;margin:0 auto}
.topline{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink2);margin-bottom:12px}
.wcard{background:#fff;border:1.5px solid var(--ink);border-radius:22px;padding:46px 36px 34px;box-shadow:6px 6px 0 var(--ink);text-align:center;min-height:330px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;user-select:none}
.wcard .w{font-size:68px;line-height:1.05;letter-spacing:-1px;word-break:break-word}
.wcard .pos{position:absolute;left:22px;top:18px}
.wcard .tier{position:absolute;right:22px;top:18px}
.wcard .m{font-size:22px;line-height:1.5;margin-top:22px;color:var(--ink);user-select:text}
.wcard .ex{font-size:17px;line-height:1.6;margin-top:16px;color:var(--ink2);text-align:left;padding:12px 16px;border-left:3px solid var(--yel);background:#FAFAF2;user-select:text}
.wcard .ex b{color:var(--ink);background:var(--yel);padding:0 3px}
.wcard .syn{font-size:16px;margin-top:12px;color:var(--ink2)}
.wcard .yrs{font-size:13px;color:var(--ink3);margin-top:14px;letter-spacing:1px}
.wcard .veil{font-size:16px;color:var(--ink3);margin-top:26px}
.hide .m,.hide .ex,.hide .syn{visibility:hidden}
.wcard input{font:inherit;font-size:34px;text-align:center;border:0;border-bottom:2px solid var(--ink);background:transparent;outline:0;width:80%;margin:14px auto 0;padding:6px;font-family:"Didot","Bodoni 72",serif}
.wcard input.bad{color:#c0292f;border-color:#c0292f}.wcard input.good{color:#1f8f2e;border-color:#1f8f2e}
.btns{display:flex;gap:12px;margin:22px 0 10px}
.btns button{flex:1;padding:18px 0;font-size:19px;font-weight:600;border:1.5px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);border-radius:12px}
.btns button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btns button small{display:block;font-size:12px;font-weight:400;color:var(--ink2);margin-top:3px}
.btns .no{background:#FFD6DA}.btns .fz{background:var(--yel)}.btns .ok{background:var(--lime)}.btns .nx{background:#fff}.btns .pri{background:var(--blue);color:#fff}
.btns .pri small{color:rgba(255,255,255,.8)}
.subrow{display:flex;gap:10px;justify-content:center;font-size:14px;color:var(--ink2);margin-bottom:12px;flex-wrap:wrap}
.subrow button{border:1px solid #999;padding:5px 12px;border-radius:8px;background:#fff}
/* list / browse */
table{width:100%;border-collapse:collapse;font-size:16px;background:#fff;border:1.5px solid var(--ink)}
th,td{padding:8px 10px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
th{background:#f0f0f0;font-size:13px;letter-spacing:1px;color:var(--ink2);font-weight:600}
td.w{font-family:"Didot","Bodoni 72",serif;font-size:20px;white-space:nowrap}
.stage{display:inline-block;min-width:36px;text-align:center;border:1.5px solid var(--ink);font-size:12px;padding:1px 6px;background:#fff}
.stage.s0{background:#fff}.stage.s1,.stage.s2{background:var(--yel)}.stage.s3,.stage.s4{background:#BFEBFF}.stage.s5,.stage.s6{background:#E6CCFF}.stage.s7{background:var(--lime)}
.stage.new{background:#eee;color:var(--ink3);border-color:#bbb}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters button{border:1.5px solid var(--ink);background:#fff;padding:4px 12px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.filters button.on{background:var(--yel)}
.filters input{font:inherit;font-size:15px;border:1.5px solid var(--ink);padding:5px 10px;background:#fff;min-width:200px}
/* pairs */
.pair{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed #aaa;font-size:19px}
.pair .pw{font-family:"Didot","Bodoni 72",serif;font-size:24px;background:#fff;border:1.5px solid var(--ink);padding:2px 10px;box-shadow:2px 2px 0 var(--ink)}
.pair .pm{color:var(--ink2);font-size:16px}
.pair.hide .pm{visibility:hidden}
/* heat */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.heat div{border:1.5px solid var(--ink);background:#fff;padding:8px 6px;text-align:center;font-size:12px;color:var(--ink2);border-radius:6px}
.heat div b{display:block;font-size:22px;color:var(--ink);font-family:"Didot","Bodoni 72",serif;font-weight:400}
.heat div.has{background:var(--lime)}
.forecast{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:10px}
.forecast div{flex:1;background:var(--yel);border:1.5px solid var(--ink);position:relative;min-height:3px}
.forecast div span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:11px;color:var(--ink2)}
.forecast div u{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:11px;color:var(--ink3);text-decoration:none;margin-top:3px}
.kv{display:flex;gap:30px;flex-wrap:wrap;font-size:16px;margin:8px 0 16px}
.kv b{font-family:"Didot","Bodoni 72",serif;font-size:34px;font-weight:400;margin-right:6px}
.done-box{text-align:center;padding:44px 20px}
.done-box h3{font-size:44px;margin:0 0 10px}
.done-box p{color:var(--ink2);font-size:17px}
textarea.io{width:100%;height:120px;font:13px/1.5 Menlo,monospace;border:1.5px solid var(--ink);padding:8px;background:#fff}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 22px;border:1.5px solid #fff;box-shadow:3px 3px 0 var(--mag);font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.k{font-size:12px;color:var(--ink3);border:1px solid #bbb;padding:0 5px;border-radius:4px;margin-left:4px;font-family:Menlo,monospace}
@media (max-width:760px){
 .page{padding:22px 14px 60px;max-width:100vw}
 .cloud{display:none}
 .eyebrow{letter-spacing:2px}
 .hero>*{min-width:0;max-width:100%}
 .meta{line-height:1.4}
 .study,.wcard,.panel,table{max-width:100%;min-width:0}
 .wcard .pos,.wcard .tier{position:static;display:inline-block;margin:0 4px 10px}
 .wcard{padding:22px 16px 24px;min-height:260px}
 .date{font-size:64px}.meta{font-size:17px}.meta b.cd{font-size:48px}.ring .pct{font-size:64px}
 .hero{flex-direction:column;min-height:0;gap:6px}.ring{text-align:left;padding-top:0}
 .grid{grid-template-columns:1fr 1fr;gap:12px}.tile.wide{grid-column:span 2}.tile{padding:14px;min-height:120px}.tile .nm{font-size:20px}.tile .big{font-size:42px}
 .wcard .w{font-size:46px}.wcard .m{font-size:19px}
 .meta{font-size:16px}.meta b.cd{font-size:44px}
 .barrow{font-size:13px}.topline{font-size:13px}
 .btns{gap:8px}.btns button{padding:13px 4px;font-size:16px;min-width:0}.btns button small{font-size:11px;white-space:normal}
 .study{width:100%}
 td.w{font-size:17px}
}

</style>
</head>

      <span class="chk"></span></button>
    <button class="tile" onclick="go('spell')">
      <div class="no">04 · 输出端</div><div class="nm">拼写 A 档</div>
      <div class="big ser">${W.filter(w => w.t === 'A').length}</div>
      <div class="sub">看释义敲单词,只练作文会用到的 A 档 284 词。</div></button>
    <button class="tile" onclick="go('pairs')">
      <div class="no">05 · 似是而非</div><div class="nm">形近词</div>
      <div class="big ser">${DATA.pairs.length}<span style="font-size:24px;color:var(--ink2)"> 组</span></div>
      <div class="sub">adapt/adopt/adept 这类,读错一个字母题就错。</div></button>
    <button class="tile" onclick="go('senses')">
      <div class="no">06 · 你认识但考的不是那个意思</div><div class="nm">熟词僻义</div>
      <div class="big ser">${DATA.senses.length}</div>
      <div class="sub">address=处理,school=学派,court=讨好。</div></button>
    <button class="tile" onclick="go('browse')">
      <div class="no">07</div><div class="nm">词表浏览 / 搜索</div>
      <div class="big ser">${W.length}</div>
      <div class="sub">按档位·词性·阶段筛,查任意一个词的记忆状态。</div></button>
    <button class="tile" onclick="go('statsv')">
      <div class="no">08</div><div class="nm">统计与预报</div>
      <div class="big ser">${st.inPool}</div>
      <div class="sub">未来 14 天每天要复习多少,先看见再决定今天学几批。</div></button>
    <button class="tile" onclick="go('settings')">
      <div class="no">09</div><div class="nm">设置 / 备份</div>
      <div class="big ser" style="font-size:40px">⚙</div>
      <div class="sub">每日新词量、导出/导入进度(换设备用)。</div></button>
  </div>
  <div class="panel soft">
    <div class="hint" style="margin:0">
    <b>怎么走间隔</b>:新词当天过关 → 明天(D1)→ D2 → D4 → D7 → D15 → D30 → D60 → 出池。复习时「记得」右移一格,「模糊」原地明天再来,「忘了」退回 D1。
    <b>每天的顺序</b>:先清复习,再学新词(300 个分 6 批),睡前把今天标红的再掏一遍。艾宾浩斯曲线的起点是「能掏出来一次」,不是「看过」——所以每张卡先想,再翻。</div>
  </div>`;
}

/* ---------- 通用卡片学习器 ---------- */
let undoStack = [];
function cardHTML(w, hidden, opts = {}) {
  const tierName = { A: 'A 档 ≥4年', B: 'B 档 2-3年', C: 'C 档 单年' }[w.t];
  const c = S.cards[w.i];
  const stage = c ? (c.s >= 8 ? '已出池' : 'D' + INT[c.s]) : '新词';
  return `<div class="wcard ${hidden ? 'hide' : ''}" id="wcard" onclick="reveal()">
    <span class="stk y pos">${w.p} · ${stage}</span><span class="stk tier">${tierName} · ${w.y}年${w.c}次</span>
    <div class="w ser">${opts.front || w.w}</div>
    <div class="m">${opts.back || w.m}</div>
    ${w.ex ? `<div class="ex">(${w.ex[0]}) ${w.ex[1].replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div>` : ''}
    ${w.syn ? `<div class="syn">${w.syn}</div>` : ''}
    <div class="yrs">${w.yr.map(y => '20' + y).join(' · ')}</div>
    ${hidden ? '<div class="veil">先想一下再翻 · 点卡片或按空格</div>' : ''}
  </div>`;
}
let cur = null; // {queue, onRate, title, left}
function reveal() { const c = $('#wcard'); if (c) c.classList.remove('hide'); if (cur) cur.revealed = true; }
function rate(k) { if (!cur || !cur.queue.length) return; cur.onRate(k); }
function undo() { const u = undoStack.pop(); if (!u) { toast('没有可撤销的'); return; } u(); save(); render(); toast('已撤销'); }
function snapshot() { return JSON.stringify({ cards: S.cards, days: S.days }); }
function restore(snap) { const o = JSON.parse(snap); S.cards = o.cards; S.days = o.days; }
function pushUndo() { const snap = snapshot(); const q = cur ? cur.queue.slice() : null; undoStack.push(() => { restore(snap); if (cur && q) cur.queue = q; }); if (undoStack.length > 30) undoStack.shift(); }

/* ---------- 复习 ---------- */
function review() {
  const ids = dueIds();
  if (!cur || cur.kind !== 'review') cur = { kind: 'review', queue: shuffle(ids).sort((a, b) => S.cards[a].s - S.cards[b].s) };
  cur.queue = cur.queue.filter(id => dueIds().includes(id));
  if (!cur.queue.length) { $('#view').innerHTML = doneBox('复习清零 ✓', `今天复习了 ${day().rev} 个。接着去学新词。`, `<button class="stk l" onclick="go('learn')">→ 今日新词</button>`); return; }
  const w = BY[cur.queue[0]]; cur.revealed = false;
  cur.onRate = k => {
    pushUndo();
    const c = S.cards[w.i], t = day();
    c.n++; c.last = TODAY;
    if (k === 1) { c.s = 1; c.due = addDays(TODAY, 1); c.l++; if (!t.hard.includes(w.i)) t.hard.push(w.i); }
    else if (k === 2) { c.due = addDays(TODAY, 1); if (!t.hard.includes(w.i)) t.hard.push(w.i); }
    else { c.s = Math.min(8, c.s + 1); c.due = c.s >= 8 ? '9999' : addDays(TODAY, INT[c.s]); }
    t.rev++; if (!t.revIds.includes(w.i)) t.revIds.push(w.i);
    cur.queue.shift(); save(); render();
  };
  $('#view').innerHTML = `<div class="study">
    <div class="topline"><span>剩余 ${cur.queue.length} · 今天已复习 ${day().rev}</span><span>${w.i + 1}/${W.length} 号</span></div>
    ${cardHTML(w, true)}
    <div class="btns">
      <button class="no" onclick="rate(1)">忘了<small>退回 D1 · 键 1</small></button>
      <button class="fz" onclick="rate(2)">模糊<small>明天再来 · 键 2</small></button>
      <button class="ok" onclick="rate(3)">记得<small>→ ${nextStageLabel(S.cards[w.i])} · 键 3</small></button>
    </div>
    <div class="subrow"><button onclick="undo()">撤销 Z</button></div></div>`;
}
function nextStageLabel(c) { const s = c.s + 1; return s >= 8 ? '出池' : 'D' + INT[s]; }

/* ---------- 新词 ---------- */
function learn() {
  const t = day();
  const pending = t.newIds.filter(id => !t.learned.includes(id));
  if (!cur || cur.kind !== 'learn') {
    // 按批:先取第一批未完成的
    let q = [];
    for (let k = 0; k < t.newIds.length; k += S.cfg.batch) {
      const b = t.newIds.slice(k, k + S.cfg.batch).filter(id => !t.learned.includes(id));
      if (b.length) { q = b; break; }
    }
    cur = { kind: 'learn', queue: q, seen: {} };
  }
  if (!cur.queue.length) {
    if (!pending.length) { $('#view').innerHTML = doneBox(`今天 ${t.newIds.length} 个新词全部过关 🎉`, `明早它们会出现在「复习到期」里。今晚睡前把 ${t.hard.length} 个标红词再掏一遍。`, `<button class="stk l" onclick="go('anchor')">→ 睡前锚点</button> <button class="stk" onclick="go('home')">回首页</button>`); return; }
    const done = t.newIds.length - pending.length;
    $('#view').innerHTML = doneBox(`这一批过关 ✓`, `已学 ${done}/${t.newIds.length}。歇一下再开下一批(${Math.min(S.cfg.batch, pending.length)} 个)。`, `<button class="stk l" onclick="cur=null;go('learn')">→ 下一批</button> <button class="stk" onclick="go('home')">回首页</button>`); return;
  }
  const w = BY[cur.queue[0]]; cur.revealed = false;
  const firstTime = !cur.seen[w.i];
  cur.onRate = k => {
    pushUndo();
    cur.seen[w.i] = (cur.seen[w.i] || 0) + 1;
    if (k === 3 && !(firstTime && cur.revealed === false && false)) {
      // 过关:进池 D1
      S.cards[w.i] = S.cards[w.i] || { s: 0, due: TODAY, n: 0, l: 0 };
      const c = S.cards[w.i]; c.s = 1; c.due = addDays(TODAY, 1); c.n++; c.last = TODAY;
      if (!t.learned.includes(w.i)) t.learned.push(w.i);
      cur.queue.shift();
    } else {
      // 模糊/不认识:塞回本批队列后面再来
      if (!t.hard.includes(w.i)) t.hard.push(w.i);
      if (!S.cards[w.i]) S.cards[w.i] = { s: 0, due: TODAY, n: 0, l: 0 };
      S.cards[w.i].l += (k === 1 ? 1 : 0);
      cur.queue.shift();
      const back = k === 1 ? 4 : 8;
      cur.queue.splice(Math.min(back, cur.queue.length), 0, w.i);
    }
    save(); render();
  };
  const batchNo = Math.floor(t.newIds.indexOf(w.i) / S.cfg.batch) + 1;
  $('#view').innerHTML = `<div class="study">
    <div class="topline"><span>第 ${batchNo} 批 · 本批剩 ${new Set(cur.queue).size} · 今日 ${t.learned.length}/${t.newIds.length}</span><span>${cur.seen[w.i] ? '第 ' + (cur.seen[w.i] + 1) + ' 次见' : '首见'}</span></div>
    ${cardHTML(w, true)}
    <div class="btns">
      <button class="no" onclick="rate(1)">不认识<small>4 个后再来 · 键 1</small></button>
      <button class="fz" onclick="rate(2)">模糊<small>8 个后再来 · 键 2</small></button>
      <button class="ok" onclick="rate(3)">认识了<small>过关 → 明天 D1 · 键 3</small></button>
    </div>
    <div class="subrow"><button onclick="undo()">撤销 Z</button><span style="align-self:center">规则:先翻面看一眼不算错,但要「认识了」必须是合上能说出意思。</span></div></div>`;
}

/* ---------- 睡前锚点 ---------- */
function anchor() {
  const t = day();
  if (!cur || cur.kind !== 'anchor') cur = { kind: 'anchor', queue: shuffle(t.hard.slice()), miss: [] };
  if (!t.hard.length) { $('#view').innerHTML = doneBox('今天没有标红的词', '新词或复习里点过「模糊/不认识」的词会攒到这里。', `<button class="stk" onclick="go('home')">回首页</button>`); return; }
  if (!cur.queue.length) {
    t.anchor = true; save(); renderHero();
    $('#view').innerHTML = doneBox('睡前锚点完成 ✓', `${t.hard.length} 个标红词过了一遍,还掏不出 ${cur.miss.length} 个(已退回 D1,明早会先见到)。关灯。`, `<button class="stk" onclick="go('home')">回首页</button>`); return;
  }
  const w = BY[cur.queue[0]]; cur.revealed = false;
  cur.onRate = k => {
    pushUndo();
    const c = S.cards[w.i] || (S.cards[w.i] = { s: 1, due: addDays(TODAY, 1), n: 0, l: 0 });
    if (k !== 3) { cur.miss.push(w.i); c.s = 1; c.due = addDays(TODAY, 1); c.l++; }
    cur.queue.shift(); save(); render();
  };
  $('#view').innerHTML = `<div class="study">
    <div class="topline"><span>锚点 · 剩 ${cur.queue.length}/${t.hard.length}</span><span>还掏不出 ${cur.miss.length}</span></div>
    ${cardHTML(w, true)}
    <div class="btns">
      <button class="no" onclick="rate(1)">还是不会<small>键 1</small></button>
      <button class="ok" onclick="rate(3)">掏出来了<small>键 3</small></button>
    </div>
    <div class="subrow"><button onclick="undo()">撤销 Z</button></div></div>`;
}

/* ---------- 拼写 ---------- */
function spell() {
  if (!cur || cur.kind !== 'spell') {
    const pool = W.filter(w => w.t === 'A');
    // 优先今天学过/复习过的 A 档,再随机补
    const t = day(); const pri = pool.filter(w => t.learned.includes(w.i) || t.revIds.includes(w.i)).map(w => w.i);
    const rest = shuffle(pool.filter(w => !pri.includes(w.i)).map(w => w.i));
    cur = { kind: 'spell', queue: shuffle(pri).concat(rest).slice(0, 30), ok: 0, bad: 0, state: 'ask' };
  }
  if (!cur.queue.length) { $('#view').innerHTML = doneBox(`拼写 30 个完成`, `对 ${cur.ok} · 错 ${cur.bad}。错的词已在「浏览」里标为需拼写。`, `<button class="stk l" onclick="cur=null;go('spell')">再来 30 个</button> <button class="stk" onclick="go('home')">回首页</button>`); return; }
  const w = BY[cur.queue[0]];
  const ex = w.ex ? `<div class="ex">(${w.ex[0]}) ${w.ex[1].replace(/\*\*(.+?)\*\*/g, '<b>____</b>')}</div>` : '';
  $('#view').innerHTML = `<div class="study">
    <div class="topline"><span>剩 ${cur.queue.length} · 对 ${cur.ok} 错 ${cur.bad}</span><span>${w.p} · 首字母 <b>${w.w[0]}</b> · ${w.w.length} 字母</span></div>
    <div class="wcard" style="cursor:default">
      <div class="m" style="margin-top:0;font-size:26px">${w.m}</div>${ex}
      <input id="spin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="敲出来 · 回车判">
      <div class="syn" id="spans"></div>
    </div>
    <div class="btns"><button class="pri" onclick="spellCheck()">判 <small>回车</small></button><button class="nx" onclick="spellSkip()">不会,看答案<small>算错</small></button></div></div>`;
  const inp = $('#spin'); inp.focus();
  inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (cur.state === 'ask') spellCheck(); else spellNext(); } };
}
function spellCheck() {
  const w = BY[cur.queue[0]], inp = $('#spin'); const v = inp.value.trim().toLowerCase();
  if (cur.state !== 'ask') { spellNext(); return; }
  const ok = v === w.w.toLowerCase();
  inp.classList.add(ok ? 'good' : 'bad'); inp.value = w.w; cur.state = 'shown';
  $('#spans').innerHTML = ok ? '✓ 对 · 回车下一个' : `✗ 你写的「${v || '(空)'}」 · 回车下一个`;
  if (ok) cur.ok++; else { cur.bad++; const t = day(); t.extra.spellBad = t.extra.spellBad || []; if (!t.extra.spellBad.includes(w.i)) t.extra.spellBad.push(w.i); save(); }
  $('.btns').innerHTML = `<button class="pri" onclick="spellNext()">下一个 <small>回车</small></button>`;
}
function spellSkip() { $('#spin').value = ''; spellCheck(); }
function spellNext() { cur.queue.shift(); cur.state = 'ask'; render(); }

/* ---------- 形近词 / 熟词僻义 ---------- */
function pairs() {
  if (!cur || cur.kind !== 'pairs') cur = { kind: 'pairs', hide: true };
  $('#view').innerHTML = `<div class="panel"><h2>形近词 <span class="n">${DATA.pairs.length} 组 · 读错一个字母题就错</span></h2>
    <div class="hint">先遮住释义自己说,点一行翻开。每天看 10 组就够。<button class="stk" style="margin-left:10px" onclick="cur.hide=!cur.hide;render()">${cur.hide ? '全部翻开' : '全部遮住'}</button></div>
    ${DATA.pairs.map((g, k) => `<div class="pair ${cur.hide ? 'hide' : ''}" onclick="this.classList.toggle('hide')"><span class="stk">${k + 1}</span>${g.map(x => { const m = x.match(/^([A-Za-z][A-Za-z\-\. ]*?)\s+(.+)$/); return m ? `<span class="pw">${m[1]}</span><span class="pm">${m[2]}</span>` : `<span class="pw">${x}</span>`; }).join('')}</div>`).join('')}</div>`;
}
function senses() {
  if (!cur || cur.kind !== 'senses') cur = { kind: 'senses', hide: true };
  $('#view').innerHTML = `<div class="panel"><h2>熟词僻义 <span class="n">${DATA.senses.length} 条 · 你认识这个词,但考的不是那个意思</span></h2>
    <div class="hint">看词,先说出「考研那个意思」,再点开。<button class="stk" style="margin-left:10px" onclick="cur.hide=!cur.hide;render()">${cur.hide ? '全部翻开' : '全部遮住'}</button></div>
    ${DATA.senses.map((g, k) => `<div class="pair ${cur.hide ? 'hide' : ''}" onclick="this.classList.toggle('hide')"><span class="stk">${k + 1}</span><span class="pw">${g[0]}</span><span class="pm">${g[1]}</span></div>`).join('')}</div>`;
}

/* ---------- 浏览 ---------- */
function browse() {
  if (!cur || cur.kind !== 'browse') cur = { kind: 'browse', tier: '', pos: '', st: '', q: '' };
  const f = cur;
  let rows = W.filter(w => (!f.tier || w.t === f.tier) && (!f.pos || w.p === f.pos) && (!f.q || w.w.includes(f.q.toLowerCase()) || w.m.includes(f.q)));
  if (f.st === 'new') rows = rows.filter(w => !S.cards[w.i]);
  else if (f.st === 'pool') rows = rows.filter(w => S.cards[w.i] && S.cards[w.i].s <= 7);
  else if (f.st === 'due') rows = rows.filter(w => S.cards[w.i] && S.cards[w.i].s <= 7 && S.cards[w.i].due <= TODAY);
  else if (f.st === 'hard') rows = rows.filter(w => S.cards[w.i] && S.cards[w.i].l >= 2);
  else if (f.st === 'done') rows = rows.filter(w => S.cards[w.i] && S.cards[w.i].s >= 8);
  const btn = (key, val, lab) => `<button class="${f[key] === val ? 'on' : ''}" onclick="cur.${key}='${val}';render()">${lab}</button>`;
  $('#view').innerHTML = `<div class="panel"><h2>词表浏览 <span class="n">${rows.length} / ${W.length}</span></h2>
    <div class="filters">${btn('tier', '', '全部档')}${btn('tier', 'A', 'A')}${btn('tier', 'B', 'B')}${btn('tier', 'C', 'C')}
     <span style="width:10px"></span>${btn('pos', '', '全词性')}${btn('pos', 'v', '动')}${btn('pos', 'n', '名')}${btn('pos', 'adj', '形')}${btn('pos', 'adv', '副')}
     <span style="width:10px"></span>${btn('st', '', '全部')}${btn('st', 'new', '未学')}${btn('st', 'pool', '在池')}${btn('st', 'due', '到期')}${btn('st', 'hard', '错≥2')}${btn('st', 'done', '出池')}
     <input id="bq" placeholder="搜单词或中文" value="${f.q}"></div>
    <table><tr><th>#</th><th>词</th><th>释义</th><th>档</th><th>阶段</th><th>下次</th><th>错</th></tr>
    ${rows.slice(0, 400).map(w => { const c = S.cards[w.i]; const st = c ? (c.s >= 8 ? '<span class="stage s7">出池</span>' : `<span class="stage s${c.s}">D${INT[c.s]}</span>`) : '<span class="stage new">未学</span>'; return `<tr><td>${w.i + 1}</td><td class="w">${w.w}</td><td>${w.m}${w.syn ? `<div style="color:var(--ink3);font-size:13px">${w.syn}</div>` : ''}</td><td>${w.t}</td><td>${st}</td><td>${c && c.s <= 7 ? c.due.slice(5) : ''}</td><td>${c ? c.l || '' : ''}</td></tr>`; }).join('')}</table>
    ${rows.length > 400 ? '<div class="hint" style="margin-top:10px">只显示前 400 条,用搜索缩小。</div>' : ''}</div>`;
  const bq = $('#bq'); bq.oninput = () => { cur.q = bq.value; const pos = bq.selectionStart; render(); const nb = $('#bq'); nb.focus(); nb.setSelectionRange(pos, pos); };
}

/* ---------- 统计 ---------- */
function statsv() {
  const st = stats();
  const days = Object.keys(S.days).sort();
  const last14 = Array.from({ length: 14 }, (_, k) => addDays(TODAY, k - 13));
  const heat = last14.map(d => { const o = S.days[d]; const n = o ? o.learned.length + o.rev : 0; return `<div class="${n ? 'has' : ''}"><b>${n}</b>${d.slice(5)}</div>`; }).join('');
  const fc = Array.from({ length: 14 }, (_, k) => addDays(TODAY, k));
  const counts = fc.map(d => Object.values(S.cards).filter(c => c.s >= 1 && c.s <= 7 && (k => (d === TODAY ? c.due <= d : c.due === d))()).length);
  // 把未来还会学的新词预报进去:假设每天 daily 个新词,第 k 天学的在 k+1,k+2,k+4,k+7 到期
  const left = st.left; let remaining = left;
  const future = Array(14).fill(0);
  for (let k = 0; k < 14 && remaining > 0; k++) { const n = Math.min(S.cfg.daily, remaining) - (k === 0 ? day().learned.length : 0); remaining -= Math.min(S.cfg.daily, remaining); if (n <= 0) continue; for (const g of [1, 2, 4, 7]) if (k + g < 14) future[k + g] += n; }
  const tot = counts.map((c, k) => c + future[k]); const mx = Math.max(1, ...tot);
  const bars = fc.map((d, k) => `<div style="height:${Math.round(tot[k] / mx * 100)}%"><span>${tot[k]}</span><u>${d.slice(5)}</u></div>`).join('');
  const allL = Object.values(S.cards).reduce((a, c) => a + (c.l || 0), 0);
  const total = Object.values(S.days).reduce((a, o) => a + o.learned.length + o.rev, 0);
  const stageDist = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(s => Object.values(S.cards).filter(c => c.s === s).length);
  $('#view').innerHTML = `<div class="panel"><h2>统计与预报</h2>
    <div class="kv"><span><b>${st.started}</b>已学</span><span><b>${st.inPool}</b>在池</span><span><b>${st.mastered}</b>出池</span><span><b>${st.left}</b>未学</span><span><b>${total}</b>累计动作</span><span><b>${allL}</b>累计忘记</span><span><b>${days.length}</b>打卡天</span></div>
    <h2 style="font-size:20px">阶段分布</h2>
    <div class="filters">${stageDist.map((n, s) => `<span class="stage s${Math.min(s, 7)}">${s === 0 ? '未过关' : s === 8 ? '出池' : 'D' + INT[s]} · ${n}</span>`).join('')}</div>
    <h2 style="font-size:20px;margin-top:18px">近 14 天动作(新词+复习)</h2><div class="heat">${heat}</div>
    <h2 style="font-size:20px;margin-top:24px">未来 14 天复习预报 <span class="n">含「按每天 ${S.cfg.daily} 个继续学新词」的推算</span></h2>
    <div class="forecast" style="margin-top:28px;margin-bottom:28px">${bars}</div>
    <div class="hint">读法:1074 词 4 天学完后,第 5-8 天是复习高峰(每天 500-700 个要掏,约 40-50 分钟),之后按 D15/D30 迅速回落。如果某天预报超过 700,把当天新词量调到 150(设置里改),别硬顶。</div></div>`;
}

/* ---------- 设置 ---------- */
function settings() {
  $('#view').innerHTML = `<div class="panel"><h2>设置 / 备份</h2>
    <div class="kv" style="align-items:center"><label>每日新词 <input id="daily" type="number" min="20" max="600" step="10" value="${S.cfg.daily}" style="font:inherit;width:90px;border:1.5px solid var(--ink);padding:4px 8px"></label>
    <label>每批 <input id="batch" type="number" min="10" max="100" step="10" value="${S.cfg.batch}" style="font:inherit;width:80px;border:1.5px solid var(--ink);padding:4px 8px"></label>
    <button class="stk l" onclick="saveCfg()">保存</button></div>
    <div class="hint">改每日新词只影响明天起的分配(今天的 ${day().newIds.length} 个已分好)。</div>
    <h2 style="font-size:20px;margin-top:20px">云同步</h2>
    <div class="hint">${CLOUD ? '☁ 已连上 dk-data/eng.json,手机电脑共用一份进度。' : (location.protocol === 'file:' ? '本机文件打开只存浏览器;上线版(github.io/dk/eng/)贴令牌后自动云同步。' : '还没贴令牌,现在只存本机。')} <button class="stk" onclick="askToken()">${token() ? '换令牌' : '贴令牌'}</button></div>
    <h2 style="font-size:20px;margin-top:20px">备份进度</h2>
    <div class="filters"><button onclick="exportState()">导出 JSON(下载+复制)</button><button onclick="importState()">从下面粘贴导入</button><button onclick="if(confirm('确定清空全部进度?'))\{localStorage.removeItem(LS);location.reload()\}" style="background:#FFD6DA">清空</button></div>
    <textarea class="io" id="io" placeholder="导出的 JSON 会出现在这里;换设备时把它粘回来点导入"></textarea>
    <div class="hint" style="margin-top:12px">进度存在本浏览器(localStorage)。换电脑/手机要导出再导入。</div></div>`;
}
function saveCfg() { S.cfg.daily = +$('#daily').value || 300; S.cfg.batch = +$('#batch').value || 50; save(); toast('已保存'); render(); }
function exportState() { const s = JSON.stringify(S); $('#io').value = s; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'application/json' })); a.download = `eng2_memo_${TODAY}.json`; a.click(); if (navigator.clipboard) navigator.clipboard.writeText(s).then(() => toast('已下载+已复制')); }
function importState() { try { const o = JSON.parse($('#io').value); if (!o.cards) throw 0; S = Object.assign(load(), o); save(); toast('已导入'); render(); } catch (e) { toast('不是有效的导出 JSON'); } }

function doneBox(h, p, btns) { return `<div class="panel"><div class="done-box"><h3 class="ser">${h}</h3><p>${p}</p><div style="margin-top:18px">${btns}</div></div></div>`; }

const VIEWS = { home, review, learn, anchor, spell, pairs, senses, browse, statsv, settings };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (!['review', 'learn', 'anchor'].includes(route)) return;
  if (e.key === ' ') { e.preventDefault(); reveal(); }
  else if (e.key === '1') rate(1); else if (e.key === '2') rate(2); else if (e.key === '3') rate(3);
  else if (e.key === 'z' || e.key === 'Z') undo();
});
window.go = go; window.rate = rate; window.reveal = reveal; window.undo = undo;
if (location.hash.startsWith('#selftest')) {
  // 自测:造 3 天数据
  localStorage.removeItem(LS); S = load();
  const d0 = addDays(TODAY, -3), d1 = addDays(TODAY, -2), d2 = addDays(TODAY, -1);
  [d0, d1, d2].forEach((d, k) => { const o = day(d); o.newIds = W.slice(k * 300, k * 300 + 300).map(w => w.i); o.learned = o.newIds.slice(); o.rev = k * 120; o.hard = o.newIds.slice(0, 20); o.anchor = true; o.newIds.forEach((id, j) => { const s = 1 + (j % 3); S.cards[id] = { s, due: addDays(d, INT[s]), n: 1, l: j % 7 === 0 ? 1 : 0, last: d }; }); });
  save(); document.title = 'SELFTEST due=' + dueIds().length;
}
const h0 = location.hash.replace(/^#(selftest-?)?/, '');
if (VIEWS[h0]) route = h0;
window.askToken = askToken;
render(); setCloudBadge();
if (!location.hash.startsWith('#selftest')) cloudInit();
if (!token() && location.hostname.endsWith('github.io') && !location.hash.startsWith('#selftest')) setTimeout(() => { if (confirm('首次打开:贴一下打卡页同一个 GitHub 令牌,进度才能手机电脑同步。现在贴?')) askToken(); }, 800);

</script>
</body>
</html>
